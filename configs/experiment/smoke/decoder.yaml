# @package _global_
# CPU smoke test of the flow matching decoder pipeline: random latents, small model, no pre-trained checkpoints.
#   make smoke   (or: python train.py --config-name rf_config experiment=smoke/decoder)
defaults:
  - override /data: dummy256_latents
  - override /model: sit-s-2
  - override /autoencoder: null
  - override /ldm_autoencoder: null
  - override /metrics: null

name: smoke/decoder
tags: ["smoke"]
mlflow_experiment: smoke              # keep smoke runs out of the real experiment

trainer_module:
  params:
    ema_rate: 0.0

checkpoint_params:
  every_n_train_steps: 1000

trainer_params:
  max_steps: 4
  accumulate_grad_batches: 1
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  limit_val_batches: 0          # validation decodes to pixels and needs the SD autoencoder checkpoint
  precision: 32-true

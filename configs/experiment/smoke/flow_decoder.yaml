# @package _global_
# CPU smoke test of the flow matching decoder (without self-guidance) on the smoke dataset.
#   python train.py --config-name train_flow_decoder experiment=smoke/flow_decoder
defaults:
  - override /model: flow_decoder_sit_s2
  - override /first_stage: pooling_stub
  - override /guidance_encoder: null
  - override /metrics: null

name: smoke/flow_decoder
tags: [smoke]
mlflow_experiment: smoke
dataset_name: smoke

trainer_module:
  params:
    use_context: False
    sample_kwargs:
      num_steps: 2            # Euler steps for validation samples

data:
  params:
    batch_size: 2
    val_batch_size: 2
    num_workers: 0
    val_num_workers: 0
    pin_memory: False

checkpoint_params:
  every_n_train_steps: 1000

trainer_params:
  max_steps: 4
  accumulate_grad_batches: 1
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  limit_val_batches: 1
  val_check_interval: 2
  check_val_every_n_epoch: null
  precision: 32-true

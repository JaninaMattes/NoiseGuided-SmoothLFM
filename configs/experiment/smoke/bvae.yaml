# @package _global_
# CPU smoke test of the β-VAE pipeline: random latents, small model, no pre-trained checkpoints.
#   make smoke   (or: python train.py experiment=smoke/bvae)
defaults:
  - override /data: dummy256_latents
  - override /model: skip-vit-bvae-s-2-t2i
  - override /autoencoder: null
  - override /flow: null
  - override /metrics: null

name: smoke/bvae
tags: ["smoke"]
mlflow_experiment: smoke              # keep smoke runs out of the real experiment

checkpoint_params:
  every_n_train_steps: 1000

trainer_params:
  max_steps: 4
  accumulate_grad_batches: 1
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  limit_val_batches: 0          # validation decodes to pixels and needs the SD autoencoder checkpoint
  precision: 32-true

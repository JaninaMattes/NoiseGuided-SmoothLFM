# @package _global_
# Thesis Stage 2b: self-guided SiT-XL/2 velocity decoder conditioned on frozen β-VAE codes z_t (+ optional class y).
# Initialised from pre-trained SiT-XL/2 weights and fine-tuned with lr 5e-5 (AdamW).
#   python train.py --config-name rf_config experiment=imnet256/sit-xl-2_context_cond \
#       ldm_autoencoder.params.ckpt_path=<path/to/bvae/last.ckpt>
defaults:
  - override /data: imagenet256_hdf5_v0
  - override /model: sit-xl-2_context
  - override /autoencoder: sd_ae
  - override /ldm_autoencoder: 05x10x_0.1b_vit_b_2  # frozen β-VAE (0.50 -> 1.00, β = 0.1)
  - override /lr_scheduler: constant
  - override /metrics: img_metrics

source_timestep: 0.50
target_timestep: 1.00

name: imnet256/sit-xl-2/context_cond/${source_timestep}x-${target_timestep}x

data:
  params:
    batch_size: 32
    val_batch_size: 16

lr_scheduler:
  params:
    num_warmup_steps: 2000

trainer_module:
  params:
    lr: 5e-5
    use_context: True           # self-guidance: condition the decoder on z_t
    ema_rate: 0.0               # no EMA

checkpoint_params:
  every_n_train_steps: 20000

trainer_params:
  limit_val_batches: 8
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  gradient_clip_val: 1.0
  precision: bf16-mixed

# @package _global_
# Thesis Stage 2a: Skip-ViT-B/2 β-VAE on the guidance-free ImageNet-256 noise space.
#   python train.py experiment=imnet256/bvae-skipvit-b-2 source_timestep=0.20 model.params.beta=5.0
defaults:
  - override /data: imagenet256_hdf5_v0         # guidance-free (x_t, x_1) pairs, see dataprocessing/
  - override /model: skip-vit-bvae-b-2-t2i
  - override /autoencoder: sd_ae                # frozen SD KL-autoencoder (f=8, 32x32x4 latents)
  - override /lr_scheduler: constant
  - override /metrics: noise_metrics            # latent noisy image metrics

source_timestep: 0.50                           # ablated in {0.0, 0.2, 0.3, 0.4, 0.5}
target_timestep: 1.00                           # 1.00 = denoising, == source_timestep = reconstruction

name: imnet256/bvae-skipvit-b-2/${source_timestep}x-${target_timestep}x-${model.params.beta}b

data:
  params:
    batch_size: 32
    val_batch_size: 16

lr_scheduler:
  params:
    num_warmup_steps: 2000

trainer_module:
  params:
    lr: 1e-4                    # constant learning rate (AdamW)
    ema_rate: 0.0               # no EMA

checkpoint_params:
  every_n_train_steps: 10000    # gradient update steps

trainer_params:
  limit_val_batches: 8
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  gradient_clip_val: 1.0
  precision: bf16-mixed

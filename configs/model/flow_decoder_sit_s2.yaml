name: SiT-S-2
# Small context-conditional flow model for debugging and smoke tests.
# Same interface as the thesis decoder (flow_decoder_sit_xl2): v_theta(x_t, t, y, z_t).
target: ldm.frameworks.flow.fm.FlowModel
params:
  schedule: linear
  sigma_min: 0.0
  net_cfg:
    target: ldm.models.transformer.dit_context.DiT
    params:
      in_channels: 4
      input_size: 32
      depth: 12
      hidden_size: 384
      patch_size: 2
      num_heads: 6
      context_size: 256                 # matches z_t of beta_vae_skip_vit_s2
      cat_context: True
      num_classes: 1000
      context_dropout_prob: 0.1
      class_dropout_prob: 0.1
      learn_sigma: False
      compile: False
